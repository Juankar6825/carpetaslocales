 tolerar un poco de torpeza.", "body": [["h", "La llamada que no quería hacer"], ["p", "Fernando lleva dos meses como diseñador autónomo. Tiene buen ojo, un portfolio cuidado y una lista de antiguos contactos que podrían necesitarle. Lo que no tiene es valor para llamarles. Abre la agenda del móvil, busca el nombre de la responsable de marketing con la que trabajó hace años y deja el dedo encima del botón verde. Luego decide que mejor le escribe un correo. Luego decide que mejor mañana."], ["p", "Cuando por fin llama, la voz le sale un poco aguda. Se trabuca al explicar sus tarifas. Ella le escucha con amabilidad y le pide que le envíe una propuesta. Al colgar, Fernando está sudando. Y aun así, es lo más útil que ha hecho en toda la semana."], ["h", "Torpe no es lo mismo que incapaz"], ["p", "La primera vez que haces algo casi nunca te sale fluido. Es lógico: no tienes práctica. Pero solemos confundir esa torpeza inicial con una prueba de que no valemos para ello. Fernando no es malo vendiendo. Es nuevo vendiendo. Son dos diagnósticos muy distintos, y el segundo tiene solución."], ["p", "Una conversación comercial puede ser respetuosa, necesaria y, aun así, incómoda. Lo mismo pasa con pedir un aumento, dar tu opinión en una reunión o hablar en público por primera vez. Esa incomodidad no siempre es una alarma. Muchas veces es simplemente el ruido que hace algo nuevo mientras se coloca."], ["h", "Una escalera, no un salto al vacío"], ["p", "La idea no es lanzarte a lo más difícil para demostrar que puedes. Es construir una escalera. Si te cuesta vender, el primer peldaño puede ser escribir a alguien que ya te conoce. El segundo, llamar a esa misma persona. El tercero, contactar con alguien que te han recomendado. El cuarto, con un desconocido. Cada peldaño te prepara para el siguiente."], ["p", "Los retos graduados tienen una ventaja: te dan margen para equivocarte en pequeño. Fallas en un correo y no pasa nada. Te trabucas con un conocido y te ríes. Así, cuando llega la conversación importante, tu cuerpo ya ha estado en sitios parecidos y no lo vive como una emergencia."], ["h", "Lo que no hace falta sufrir"], ["p", "Ojo con el extremo contrario. Hay quien convierte el crecimiento en una competición de aguante: cuanto más duele, más vale. No es así. La incomodidad útil tiene un propósito claro y un límite razonable. El sufrimiento gratuito solo te deja agotado y con ganas de abandonar."], ["p", "Si una situación pone en riesgo tu salud, tu dinero o tu seguridad, no es un reto: es un riesgo, y merece otra conversación. Y si la ansiedad que sientes es tan intensa que te bloquea durante días, no tienes por qué resolverlo a base de fuerza de voluntad. Un profesional puede ayudarte a ir más despacio y con mejores herramientas."], ["q", "No eres malo en eso, eres nuevo en eso."], ["vivio", "Negocio", ["Un día, en la oficina, me di cuenta de algo incómodo: no estaba siendo jefe. Estaba siendo padre.", "Les resolvía los problemas antes de que los intentaran. Hacía yo lo que les tocaba a ellos. Y evitaba exigir, para no incomodar a nadie. Creía que eso era cuidar.", "Pero era el ego. Me gustaba sentirme imprescindible, y me ahorraba la incomodidad de poner límites. Ese era el placer secreto que mantenía el patrón. Lo reconocí, lo entregué a la Divinidad y vi algo claro: cuando sobreproteges, no dejas crecer.", "Un verdadero jefe confía, exige con amor y deja que cada uno asuma su responsabilidad. Por eso ahora, cuando alguien de mi equipo me trae un problema, no se lo resuelvo. Le pregunto: «¿Tú qué harías?». Cuidar también es dejar crecer."]], ["cuaderno", ["Elige una incomodidad pequeña que te frene: llamar en vez de escribir, preguntar en una reunión, pedir un descuento, decir tu precio en voz alta. Que sea segura y que dependa de ti. Ahora practícala tres veces esta semana, en días distintos. Después de cada intento apunta tres cosas: qué temías que pasara, qué pasó en realidad y cómo de incómodo fue del uno al diez. Al tercer intento, compara las notas. No buscas hacerlo perfecto. Buscas comprobar que puedes hacerlo con nervios."]]]}, {"n": "03", "title": "Límites que protegen tu energía", "sub": "Decir no también es una forma de compromiso.", "body": [["h", "Gloria siempre puede"], ["p", "Gloria trabaja en el departamento administrativo de una empresa de transportes. Es la persona a la que todo el mundo acude. El lunes le piden que cubra a un compañero en una reunión. El martes, que revise un informe que no es suyo. El miércoles, su cuñada le pregunta si puede quedarse con el perro el fin de semana. El jueves, el grupo de madres del colegio la propone para organizar la fiesta de fin de curso."], ["p", "Gloria dice que sí a todo. El viernes por la noche se da cuenta de que no ha avanzado ni una línea en el curso que se había prometido terminar este trimestre. Y lo que siente no es orgullo por haber ayudado. Es una mezcla rara de cansancio y rabia que no sabe hacia quién dirigir."], ["h", "Cada sí tiene una factura"], ["p", "Cuando aceptas una petición, no solo das tu tiempo. Das tu atención, tu energía y, a menudo, tu descanso. Si dices que sí a todo, lo importante para ti queda siempre para el final del día, cuando ya no te queda nada. Y como siempre hay alguien que necesita algo, ese final nunca llega."], ["p", "No se trata de volverte egoísta ni de dejar de ayudar. Se trata de elegir. Un sí dicho con ganas suma. Un sí dicho por miedo a quedar mal resta, aunque nadie lo vea. Cuando proteges tu energía no estás fallando a los demás. Estás comprometiéndote con algo que también importa: tu propia vida."], ["h", "Un no que cabe en dos frases"], ["p", "Muchas personas no dicen que no porque no saben cómo hacerlo sin sentirse groseras. Así que dan rodeos, se justifican durante cinco minutos y, a mitad de la explicación, terminan cediendo. La solución es tener preparada una respuesta corta, clara y amable."], ["p", "Por ejemplo: «Gracias por contar conmigo. Esta vez no puedo». O bien: «Ahora mismo no tengo margen para hacerlo bien, así que prefiero decirte que no». Si quieres, puedes ofrecer una alternativa real: «Este viernes no, pero el mes que viene sí te puedo echar una mano». No necesitas un informe detallado de tu agenda. Cuantas más explicaciones das, más grietas ofreces para negociar."], ["p", "Habrá quien se moleste. Es normal, sobre todo con personas acostumbradas a tu sí automático. Su molestia no significa que hayas hecho algo mal. Significa que algo ha cambiado."], ["q", "Cada sí que no sientes es un no a ti."], ["vivio", "Desarrollo personal", ["Me piden un favor. No puedo, o directamente no quiero, y digo que sí. Otra vez. Lo hago para no quedar mal, para que nadie se enfade conmigo. Y lo curioso es que al final sí acaba enfadándose alguien. Ese alguien soy yo.", "Ese enfado no hace ruido por fuera. Se queda dentro, como una cuenta pendiente que no sabes a quién cobrar. Porque la otra persona no ha hecho nada malo. Solo ha preguntado. El que ha dicho sí sin sentirlo he sido yo.", "Lo que entendí es esto: cada sí que no siento es un no a mí. Un no a mi tiempo, a mi energía, a lo que de verdad quiero construir. Por eso digo que aprender a decir que no es la base de toda manifestación. No puedes crear la vida que quieres si siempre dejas que tu agenda la escriban los demás."]], ["cuaderno", ["Piensa en las dos peticiones que más te cuesta rechazar: un compañero que te pasa tareas, un familiar que da por hecho que estarás disponible, un cliente que pide extras sin pagarlos. Para cada una, escribe una respuesta de no más de dos frases. Que sea clara, amable y sin justificaciones largas. Si quieres, añade una alternativa que de verdad estés dispuesto a cumplir. Después léelas en voz alta tres veces, como quien ensaya un texto. La próxima vez que llegue la petición, no tendrás que improvisar."]]]}, {"n": "04", "title": "Volver después de interrumpirte", "sub": "La continuidad perfecta es una fantasía.", "body": [["h", "Doce días sin salir a correr"], ["p", "Rubén había conseguido algo que llevaba años intentando: salir a correr tres mañanas por semana. Lo mantuvo durante dos meses. Luego llegó un viaje de trabajo de cinco días y, justo al volver, una gripe que le tuvo en casa una semana. Cuando se recuperó, miró las zapatillas en la entrada y sintió algo parecido a la vergüenza."], ["p", "«Ya lo he perdido todo», pensó. Y para compensar decidió que el lunes saldría a correr el doble. Lo hizo. El martes le dolía todo. El miércoles no salió. El jueves tampoco. Dos semanas después, las zapatillas seguían en la entrada."], ["h", "La trampa del todo o nada"], ["p", "Interrumpir una rutina no es un fracaso. Es parte de la vida. Hay viajes, enfermedades, mudanzas, temporadas de trabajo intenso, hijos que se ponen malos. Nadie mantiene un hábito sin una sola pausa. El problema no es parar. El problema es lo que te cuentas cuando paras."], ["p", "Si piensas que una interrupción borra todo lo anterior, cualquier tropiezo se convierte en el final. Y si intentas recuperar el tiempo perdido de golpe, te pones una exigencia que tu cuerpo o tu agenda no pueden sostener. Las compensaciones extremas suelen terminar en una segunda pausa, más larga que la primera."], ["p", "Lo que aprendiste no desaparece en una semana. Rubén sigue sabiendo cuál es su ritmo, qué ruta le gusta y a qué hora le resulta más fácil salir. Eso no se lo ha llevado la gripe."], ["h", "Un protocolo para el día de regreso"], ["p", "La forma más sencilla de volver es decidir antes cómo vas a volver. Un protocolo de regreso es un plan mínimo, pensado para el día en que retomas, que no exige estar en tu mejor momento."], ["p", "Por ejemplo: la primera semana haces la mitad de lo que hacías. Si corrías treinta minutos, sales quince. Si escribías una página al día, escribes media. Si meditabas diez minutos, haces cinco. La segunda semana subes un poco. La tercera vuelves a tu nivel. Lo importante no es la cantidad. Es que tu cerebro registre que la práctica sigue viva."], ["p", "Prepara también el terreno para ese primer día. Deja las zapatillas a la vista, el libro en la mesilla, el documento abierto en el ordenador. Decide la hora exacta y apúntala en el calendario. Cuantas menos decisiones tengas que tomar ese día, más fácil será empezar. Y si te saltas el primer día de regreso, no pasa nada: aplica el protocolo al día siguiente, sin sumar lo que faltó."], ["p", "Si la pausa ha sido por enfermedad, consulta con tu médico antes de retomar cualquier actividad física. Volver con cuidado también es volver."], ["q", "Una pausa no borra lo que aprendiste."], ["voz", ["Creo que nos hemos inventado una regla absurda: si fallas un día, ya no vale. Como si la constancia fuera una cadena que se rompe para siempre al primer eslabón suelto. No funciona así. La constancia se parece más a volver que a no irse nunca. La pregunta útil no es por qué paraste. Es cuál es el paso más pequeño para volver hoy."]], ["cuaderno", ["Elige una práctica que te importe y que hayas interrumpido alguna vez, o que temas interrumpir: ejercicio, lectura, escritura, ahorro, meditación. Imagina que llevas siete días sin hacerla. Ahora escribe tu plan de regreso. Qué harás el primer día, en versión mínima. Qué harás la primera semana. Cuándo volverás a tu nivel habitual. Qué frase te dirás si notas la tentación de compensar a lo grande. Guarda el plan donde puedas encontrarlo el día que lo necesites."]]]}, {"n": "05", "title": "El valor de pedir apoyo", "sub": "La autonomía no es aislamiento.", "body": [["h", "La panadería de Mónica"], ["p", "Mónica abrió su panadería hace tres años en un barrio de las afueras. Funciona, pero desde hace meses algo no cuadra: trabaja más horas que nunca y los números no mejoran. Cada noche, cuando cierra, se sienta con una libreta y repasa gastos. Le da vueltas a lo mismo. No habla de ello con nadie."], ["p", "Su hermana le ha preguntado alguna vez si va todo bien. Ella siempre contesta lo mismo: «Sí, bien, liada». Tiene una amiga que lleva una tienda desde hace quince años, una gestora que le hace los impuestos y un antiguo jefe que siempre le dijo que le llamara si necesitaba algo. No ha llamado a nadie. Piensa que pedir ayuda sería reconocer que no sabe llevar su propio negocio."], ["h", "Arreglártelas por tu cuenta tiene un límite"], ["p", "Hay una forma de independencia que se parece mucho a la soledad. Te enorgulleces de no deber nada a nadie, de resolverlo todo por tu cuenta, de no molestar. Hasta que el problema es más grande que tu perspectiva. Porque esa es la cuestión: no es que no seas capaz. Es que desde dentro de un problema cuesta verlo entero."], ["p", "Una persona de fuera puede ver en diez minutos lo que tú llevas meses sin ver. No porque sea más lista, sino porque no está atrapada en tu rutina, en tus miedos ni en tus costumbres. La autonomía no consiste en no necesitar a nadie. Consiste en elegir bien a quién acudes y para qué."], ["h", "Cada pregunta tiene su puerta"], ["p", "No todo el mundo sirve para todo. Un colega del mismo sector puede ayudarte con lo práctico: proveedores, precios, horarios. Un mentor, con la visión de largo plazo y las decisiones difíciles. Una asesoría profesional, con los números, los contratos o lo legal. Un médico o un psicólogo, con lo que te está pasando por dentro cuando el cansancio o la angustia se instalan. Y tu gente cercana, con algo igual de importante: que no te sientas solo."], ["p", "Si le llevas a tu hermano una duda fiscal, te frustrarás. Si le llevas a tu gestor un agotamiento emocional, también. Antes de pedir ayuda, pregúntate qué tipo de ayuda necesitas."], ["h", "Una petición que se pueda contestar"], ["p", "«Necesito ayuda con la panadería» es difícil de responder. «¿Podrías dedicarme media hora esta semana para mirar conmigo los gastos fijos y decirme qué ves raro?» es fácil. Una buena petición dice qué necesitas, cuánto tiempo pides y para qué. Así la otra persona sabe exactamente a qué dice que sí, y es mucho más probable que lo haga."], ["q", "Nadie ve entero el problema en el que está metido."], ["vivio", "Desarrollo personal", ["Un día lo tuve más claro que nunca. Antes de pedirle nada a la vida, tenía que saber quién quería ser. Qué persona. Qué identidad quería encarnar.", "Y entendí que el primer paso para llegar ahí no era esperar. Era invertir en mí. Constantemente. Más habilidades, más conocimiento, porque cada cosa que aprendes acorta el camino hasta tu destino.", "Pero hay una forma de acelerarlo todavía más: aprender de alguien que ya ha llegado donde tú quieres estar. Un mentor. Alguien que ya ha cometido los errores que tú te vas a ahorrar. Cuando inviertes así, con inteligencia, la inversión se multiplica y te vuelve por diez: en tiempo, en dinero y en decisiones que aciertas a la primera.", "Eso sí, invertir con inteligencia no es comprar el primer curso que te promete el cielo. Es elegir a alguien con resultados reales en lo que tú quieres conseguir. Escribe quién quieres ser y pregúntate quién ha llegado ya ahí. Ese es tu siguiente paso."]], ["cuaderno", ["Dibuja un mapa sencillo con tres personas o recursos a los que podrías acudir. Para cada uno, escribe su nombre, qué tipo de ayuda puede darte (práctica, profesional, emocional) y en qué situación tendría sentido recurrir a él. Después elige uno y redacta una petición concreta: qué necesitas, cuánto tiempo pides y para qué. Si la situación lo pide, envíala esta misma semana. Si no, guárdala. Tenerla escrita ya te acerca a usarla cuando haga falta."]]]}, {"n": "06", "title": "Fracasar con inteligencia", "sub": "Cada resultado contiene datos, no una sentencia.", "body": [["h", "El correo de las nueve y cuarto"], ["p", "Alberto es consultor de formación para empresas. Llevaba tres semanas preparando una propuesta para una cadena de tiendas: reuniones, documentos, un presupuesto ajustado al detalle. El martes a las nueve y cuarto llega el correo. «Agradecemos mucho su propuesta, pero hemos decidido seguir otro camino»."], ["p", "Alberto cierra el portátil. Durante el resto de la mañana se repite una frase: «Soy un desastre vendiendo». Por la tarde ya ha decidido que quizá debería dejar de ofrecer ese tipo de servicio. Por la noche duda de si sirve para trabajar por su cuenta. En doce horas, un correo de dos líneas se ha convertido en un juicio sobre toda su carrera."], ["h", "El resultado no es tu nombre"], ["p", "Cuando algo sale mal, la mente tiende a saltar del hecho a la identidad. No he conseguido este cliente se convierte en no valgo. Esta propuesta no ha encajado se convierte en soy un fracaso. Es un salto enorme y, casi siempre, injusto."], ["p", "Separar tu dignidad del resultado no significa que te dé igual. Puede doler, y es razonable que duela si te importaba. Significa que el resultado habla de una situación concreta, en un momento concreto, con unas condiciones concretas. No habla de quién eres como persona. Puedes perder una propuesta y seguir siendo un buen profesional que esta vez no acertó."], ["h", "Lo que una negativa puede enseñarte"], ["p", "Un rechazo trae información si te tomas la molestia de leerla. Quizá el precio no encajaba con su presupuesto. Quizá el momento no era el adecuado y en seis meses la situación sea otra. Quizá la propuesta resolvía un problema que ellos no sentían como urgente. Quizá había otro proveedor con quien ya tenían relación."], ["p", "A veces puedes preguntarlo directamente. Un mensaje breve y educado basta: «Gracias por la respuesta. Para mejorar, ¿me podrías decir qué pesó más en la decisión?». No todo el mundo contestará, y nadie está obligado. Pero cuando contestan, esa respuesta vale más que muchos días dándole vueltas en tu cabeza."], ["h", "Un registro en vez de un reproche"], ["p", "Convierte cada intento fallido en una entrada de cuaderno, no en una cicatriz. Qué intentaste, qué pasó, qué factores crees que influyeron, qué cambiarías la próxima vez. Con el tiempo, ese registro te enseñará patrones que ahora no ves: qué tipo de cliente encaja contigo, qué precio funciona, en qué época del año conviene presentar propuestas."], ["p", "Alberto podría escribir algo así: «Propuesta de formación para una cadena de tiendas. No aceptada. Posibles motivos: presupuesto por encima de lo que esperaban, poco contacto previo con quien decidía. Próxima vez: preguntar el rango de presupuesto en la primera reunión y hablar antes con la persona que firma». No hay ni un insulto en esas líneas. Solo información que puede usar el lunes."], ["q", "Un rechazo es una respuesta, no una sentencia."], ["voz", ["Cuando algo no sale, hazte una pregunta muy simple: ¿qué sé ahora que no sabía antes? Si la respuesta es nada, quizá todavía estás demasiado enfadado para mirarlo. Si encuentras algo, aunque sea pequeño, el intento ya no ha sido en vano. Fracasar duele. Fracasar y no aprender nada duele dos veces."]], ["cuaderno", ["Elige un fracaso reciente o antiguo que todavía te pese. Escribe una página sobre él con una sola regla: no puedes usar etiquetas personales. Nada de «soy un desastre», «no sirvo», «siempre la cago». Describe solo lo que pasó, qué hiciste, qué factores externos influyeron y qué podrías probar distinto la próxima vez. Si te sorprendes escribiendo una etiqueta, táchala y sustitúyela por un hecho. Al terminar, subraya una sola frase que puedas usar como aprendizaje."]]]}, {"n": "07", "title": "Tu pacto contigo", "sub": "La confianza propia crece con compromisos realistas.", "body": [["h", "La promesa de las dos horas"], ["p", "Natalia es enfermera y trabaja a turnos. En septiembre decidió que este curso iba a sacarse el nivel de inglés que necesita para optar a otro puesto. Se compró un libro, se descargó una aplicación y se prometió estudiar dos horas cada día. El primer día lo cumplió. El segundo tuvo turno de noche. El tercero estaba agotada. Al final de la semana había estudiado un solo día de siete."], ["p", "Lo peor no fueron las horas perdidas. Fue lo que pensó de sí misma: «Para qué me engaño. Nunca cumplo nada». Y con esa frase, el libro de inglés acabó en una estantería."], ["h", "Las promesas que te desgastan"], ["p", "Cada vez que te prometes algo y no lo cumples, la confianza en ti mismo se resiente un poco. No es un drama, pero se acumula. Si te prometes cosas enormes que tu vida no puede sostener, acabas fallando muchas veces. Y cada fallo refuerza la idea de que no eres de fiar."], ["p", "Prometer dos horas diarias y fallar seis días deja peor huella que cumplir quince minutos todos los días. Lo primero te enseña que tu palabra no vale. Lo segundo, que sí. Y esa diferencia, repetida durante semanas, cambia cómo te ves."], ["h", "Pequeña, medible y compatible"], ["p", "Un buen pacto contigo tiene tres rasgos. Es pequeño: lo bastante modesto como para cumplirlo en un mal día. Es medible: al final de la jornada sabes, sin dudas, si lo has hecho o no. Y es compatible con tu vida real, con tus turnos, tus hijos, tu cansancio y tus imprevistos."], ["p", "Para Natalia, eso podría ser: quince minutos de inglés los días que no tiene turno de noche, y cinco minutos de vocabulario en el descanso cuando sí lo tiene. No suena heroico. Pero puede cumplirlo. Y cumplirlo, una y otra vez, es lo que reconstruye la confianza."], ["h", "La revisión de cada semana"], ["p", "Un pacto no es una ley escrita en piedra. Una vez por semana, siéntate cinco minutos y revisa. Cuántos días lo cumpliste, qué te lo puso difícil, qué te lo puso fácil. Si fue demasiado fácil, sube un poco. Si fue imposible, bájalo sin culpa. Ajustar no es rendirse. Es diseñar un compromiso que de verdad se pueda sostener."], ["p", "Y cuando falles algún día, que fallarás, no conviertas ese día en una sentencia. Un día sin cumplir es un dato. Dos seguidos son una señal para revisar el pacto, no para tirarlo. Lo que rompe la confianza no es el fallo aislado. Es abandonar en cuanto aparece. Si al día siguiente vuelves a cumplir, tu palabra sigue en pie."], ["q", "Tu palabra vale lo que valen tus promesas pequeñas."], ["voz", ["Creo que la confianza en uno mismo no se gana con discursos frente al espejo. Se gana cumpliendo. Cosas pequeñas, todos los días, sin que nadie aplauda. Cada vez que haces lo que dijiste, te demuestras algo. Y llega un momento en que ya no necesitas convencerte de que puedes. Simplemente lo sabes, porque lo has visto."]], ["cuaderno", ["Redacta tu pacto de treinta días. Escribe qué vas a hacer, cuánto tiempo o cuántas veces, en qué momento del día y cómo sabrás que lo has cumplido. Asegúrate de que puedes cumplirlo incluso en tu peor día de la semana. Marca en el calendario cuatro revisiones, una por semana, de cinco minutos cada una. En cada revisión anota los días cumplidos, qué te ayudó, qué te frenó y si necesitas ajustar el pacto. Fírmalo con tu nombre y la fecha. Es un contrato contigo."]]]}], "cierre": {"title": "Fuerte sin ser de piedra", "body": [["p", "Si has llegado hasta aquí, ya sabes que ser inquebrantable no tiene nada que ver con no sentir. Tiene que ver con atravesar lo que duele con apoyo, con aceptar la torpeza de lo nuevo, con decir que no cuando hace falta, con volver después de cada pausa, con pedir ayuda a tiempo, con aprender de lo que no sale y con cumplir pequeñas promesas contigo."], ["p", "No tienes que practicarlo todo a la vez. Elige una sola idea y llévala a tu semana. Una semana bien vivida vale más que cien propósitos grandilocuentes. Al final, revisa qué aprendiste y qué estás dispuesto a mantener."]], "plan": ["Día 1 · Haz tres columnas: aceptar, actuar, pedir ayuda.", "Día 2 · Elige una incomodidad pequeña y practícala por primera vez.", "Día 3 · Escribe y ensaya dos respuestas para decir que no.", "Día 4 · Escribe tu plan para retomar una práctica tras siete días de pausa.", "Día 5 · Haz un mapa de tres personas o recursos a los que acudir.", "Día 6 · Escribe una página sobre un fracaso sin usar etiquetas personales.", "Día 7 · Redacta un pacto de treinta días con revisión semanal."], "frase": "El siguiente paso no tiene que ser perfecto. Tiene que ser real."}, "img": "mod06.jpg"}, {"n": "07", "title": "VIVE COMO EL GRAN MANIFESTADOR", "intro": ["Has llegado al último tramo. Ya sabes mirar lo que toleras, cuestionar tus creencias, decidir con criterio y sostener hábitos. Ahora toca algo menos vistoso y más difícil: vivirlo un martes cualquiera, sin que nadie te aplauda. Este módulo no trata de llegar a una cima y quedarte allí. Trata de convertir lo aprendido en una forma de estar en el mundo: cómo eliges, cómo usas el dinero, cómo esperas lo que no depende de ti, cómo celebras, cómo cuentas lo que te ha servido sin convertirlo en dogma y cómo decides cuál es tu siguiente estación. Al final escribirás tu propio manifiesto. No una lista de deseos bonitos, sino unas cuantas líneas que puedas cumplir y revisar. Vivir como el Gran Manifestador no es vivir sin dudas. Es tener claro qué haces con ellas."], "ruta": ["La persona que estás construyendo", "Abundancia con los pies en la tierra", "Tu relación con la incertidumbre", "Celebrar sin detenerte", "Compartir sin predicar", "Diseña tu próxima estación", "El manifiesto de tu vida"], "lessons": [{"n": "01", "title": "La persona que estás construyendo", "sub": "La identidad se demuestra en elecciones repetidas.", "body": [["h", "Las siete y cuarto de un miércoles"], ["p", "Cristina tiene treinta y ocho años y trabaja como enfermera con turnos rotativos. En Nochevieja se prometió que este sería «el año de cuidarse». Lo dijo en la cena, lo escribió en una libreta y hasta cambió la foto de perfil. Hoy es miércoles, son las siete y cuarto de la tarde y acaba de salir de un turno largo. Tiene dos opciones: pedir comida a domicilio y caer en el sofá con el móvil, o calentar lo que dejó preparado el domingo y acostarse a una hora razonable."], ["p", "Nadie la está mirando. No hay público para esta decisión. Y precisamente por eso cuenta. La persona que Cristina quiere ser no se decidió en Nochevieja ni en la foto de perfil. Se decide aquí, en una cocina, con los pies cansados."], ["p", "No necesitas anunciar una transformación. Puedes mostrarla en cómo organizas el día."], ["h", "Lo que haces cuando nadie lo anota"], ["p", "Solemos pensar en la identidad como algo que se tiene: soy así, soy de esta manera. En la práctica funciona más como algo que se vota. Cada elección repetida es un voto. Un voto no gana unas elecciones. Muchos votos en la misma dirección, sí."], ["p", "Esto tiene una parte liberadora. No tienes que sentirte ya la persona que quieres ser para empezar a comportarte como ella. Tampoco tienes que acertar siempre. Cristina puede pedir comida un miércoles y no pasa nada. Lo que importa es hacia dónde se inclina la mayoría de sus miércoles."], ["p", "Y tiene una parte incómoda: tus elecciones repetidas ya están diciendo quién eres, te guste o no. Si cada noche aplazas lo que dijiste que era importante, tu identidad real no es la de tu libreta. Es la de tu agenda."], ["h", "Tres conductas, no tres virtudes"], ["p", "Si te pregunto cómo sería tu versión más coherente, es fácil contestar con palabras grandes: más tranquila, más valiente, más disciplinado. El problema es que esas palabras no se pueden hacer un martes. Hay que bajarlas al suelo."], ["p", "Prueba a describir esa versión con tres conductas observables. No «ser más paciente», sino «escuchar hasta el final antes de responder en las reuniones». No «cuidarme», sino «dejar la cena preparada dos días por semana». No «ser más profesional», sino «contestar los correos importantes antes de las doce». Una conducta se cumple o no se cumple. Una virtud, en cambio, siempre deja margen para engañarte."], ["p", "Cuando eliges conductas concretas, también te quitas presión. Ya no tienes que convertirte en otra persona de golpe. Solo tienes que hacer hoy una de esas tres cosas."], ["q", "No eres lo que anuncias. Eres lo que repites cuando nadie mira."], ["vivio", "Negocio", ["Durante mucho tiempo pensé que ser buen jefe era conseguir que mi equipo hiciera lo que yo quería. Dar órdenes, controlar, exigir resultados. Mi pregunta de fondo era siempre la misma: ¿cómo consigo que ellos cambien?", "Un día cambié la pregunta. Empecé a preguntarme cómo actuaría aquí el mejor jefe posible. Y empecé a serlo. Sin imponer. Con temple. Siendo el primero en hacer lo que pedía. Escuchando antes de hablar. Con un comportamiento empático.", "Empecé a ver el potencial de cada persona y a tratarla como si ya lo estuviera demostrando. Y descubrí algo: cuando alguien se siente reconocido, empieza a estar a la altura de lo que ves en él. Trabaja mejor. Y eso lo notan los clientes.", "No cambias a los demás. Cambias tú, y todo a tu alrededor se mueve contigo. Creas magia solo trabajando en ti. Si tienes equipo, prueba esto esta semana: elige a una persona, dile lo que ves en ella y trátala como si ya lo fuera."]], ["cuaderno", ["Escribe tres conductas concretas que representarían tu versión más coherente. Que se puedan ver y comprobar, nada de adjetivos. Elige una sola y practícala durante siete días. Cada noche, marca en una hoja si la hiciste o no, sin justificaciones ni castigos. Al final de la semana, anota qué te costó, qué te sorprendió y si quieres mantenerla una semana más."]]]}, {"n": "02", "title": "Abundancia con los pies en la tierra", "sub": "Abundancia no es negar facturas.", "body": [["h", "Las cartas del banco sin abrir"], ["p", "Ramón tiene cincuenta y dos años y un pequeño taller de reparación de bicicletas. Hace un tiempo empezó a escuchar pódcast sobre abundancia. Le gustaron. Le ayudaron a quejarse menos y a valorar lo que tenía. Pero un día se dio cuenta de algo raro: llevaba tres meses sin abrir las cartas del banco. «No quiero meterme en esa energía», le dijo a su hermana. Ella le miró y le preguntó si la energía también pagaba el alquiler del local."], ["p", "Ramón no es tonto. Le pasa lo que le pasa a mucha gente: confundió pensar en positivo con no mirar. Y no mirar es exactamente lo contrario de tener los pies en la tierra."], ["p", "Agradecer lo que tienes y buscar oportunidades puede convivir con un presupuesto, con límites y con números claros. De hecho, convive mejor."], ["h", "La abundancia tiene varias cuentas"], ["p", "Cuando hablamos de abundancia casi siempre pensamos en dinero. Si lo miras de cerca, hay al menos cuatro dimensiones que se mezclan y conviene separar. Bienestar: cómo duermes, cómo comes, cuánta energía tienes. Solvencia: cuánto entra, cuánto sale, qué debes y qué colchón tienes. Relaciones: con quién cuentas y quién cuenta contigo. Tiempo: cuántas horas son de verdad tuyas."], ["p", "Se puede ir bien en una y mal en otra. Hay personas con dinero y sin un minuto libre. Personas con poco margen económico y una red de apoyo enorme. Si las mezclas, te engañas. Si las separas, ves dónde estás fuerte y dónde necesitas trabajar. Y dejas de sentir que «todo va mal» cuando en realidad hay una cuenta en rojo y tres que aguantan."], ["h", "Sentirte digno no es endeudarte"], ["p", "Hay una idea que circula mucho: actúa como si ya tuvieras lo que deseas. Tiene una parte útil. Cambiar el lugar desde el que miras cambia lo que te permites intentar. Mal entendida, en cambio, lleva a la tarjeta de crédito y a compras que no puedes sostener para sentirte a la altura."], ["p", "La línea es sencilla. Una experiencia pequeña que te amplía la mirada, sí. Un gasto que compromete tu mes, no. Si tienes dudas serias con deudas, préstamos o inversiones, habla con un profesional antes de decidir."], ["q", "La abundancia que ignora las facturas acaba siendo otra factura."], ["vivio", "Desarrollo personal", ["Un día me tomé un café en un buen hotel en vez de en un bar normal. Y entendí que no estaba pagando unos euros más por el café. Estaba pagando por estar dentro de otra energía. El silencio. El trato. La gente que se mueve sin prisa. Los detalles. Un ambiente chic y elegante.", "Lo que vives a menudo se vuelve normal para ti. Si quieres más dinero, necesitas saber cómo se siente estar donde está el dinero. Sentarte ahí sin sentirte pequeño, como si fuera tu sitio. Eso es encarnar la identidad: no esperas a ser millonario para ir, vas para empezar a serlo. Y además mueves el dinero, lo das con gusto, sin miedo. Cuando das con gratitud, también recibes.", "Pero escúchame bien: esto no es gastar lo que no tienes. Es un café, no una deuda. Una inversión pequeña en quién quieres ser.", "Elige un sitio que hoy te parezca demasiado para ti. Ve, pide un café y quédate hasta que sientas que perteneces."]], ["cuaderno", ["Haz un inventario de tus recursos en las cuatro cuentas: bienestar, solvencia, relaciones y tiempo. En cada una apunta lo que tienes, no solo lo que te falta. Después elige una mejora económica responsable para este mes: revisar suscripciones, preparar un presupuesto sencillo, comparar el precio de un seguro o reservar una cantidad fija para ahorrar. Algo pequeño, medible y que no dependa de que el universo te sorprenda."]]]}, {"n": "03", "title": "Tu relación con la incertidumbre", "sub": "Nadie puede garantizarte el desenlace.", "body": [["h", "La entrevista que salió bien y no salió"], ["p", "Lidia tiene veintinueve años y lleva dos meses buscando trabajo como diseñadora. Para la última entrevista se preparó como nunca: investigó la empresa, ensayó respuestas en voz alta con una amiga, rehízo su portafolio y llegó diez minutos antes. Salió convencida de que había estado bien. Y había estado bien. Una semana después recibió un correo amable: habían elegido a otra candidata."], ["p", "Lo primero que pensó fue: «Algo hice mal». Lo segundo: «Para qué me esfuerzo». Las dos frases son comprensibles. Las dos son injustas con ella."], ["p", "Puedes preparar una entrevista impecable y no recibir la oferta. Eso no invalida tu preparación. Solo te recuerda que la decisión final no era tuya."], ["h", "Tres círculos en una hoja"], ["p", "Una de las trampas de cierto discurso sobre la manifestación es que te hace responsable de todo. Si sale bien, lo atrajiste. Si sale mal, algo fallaba en tu energía. Esa forma de pensar parece que te da poder, pero en realidad te deja agotado y lleno de culpa."], ["p", "Es más útil dibujar tres círculos. En el primero, lo que depende de ti: tu preparación, tu puntualidad, cómo respondes, si haces seguimiento. En el segundo, lo que puedes influir: la impresión que causas, tu red de contactos, el momento en que te presentas. En el tercero, lo que no controlas: el presupuesto de la empresa, las otras candidatas, el criterio de quien decide, una reorganización interna que nadie te contó."], ["p", "Cuando separas los círculos, tu energía se va donde sirve. Y dejas de pedirte cuentas por lo que nunca estuvo en tu mano."], ["h", "Comprometerte con el proceso"], ["p", "Esto no significa dejar de desear el resultado. Lidia quería ese trabajo y es sano que le duela no conseguirlo. Significa que tu compromiso está con lo que haces, no con lo que deciden otros. El proceso lo puedes repetir, mejorar y ajustar. El desenlace, no siempre."], ["p", "Hay personas que, para no sentir la incertidumbre, dejan de intentarlo. Así no pierden, pero tampoco ganan. Otras intentan controlarlo todo y se agotan. Entre las dos hay un sitio más tranquilo: hacer bien tu parte, soltar lo demás y preguntarte qué puedes aprender. A veces la respuesta es «nada, simplemente no era para mí esta vez». También vale."], ["p", "Lidia se dio dos días para estar fastidiada. Sin dramas, pero sin fingir que le daba igual. Al tercero escribió a la empresa para agradecer el proceso y pedir, si era posible, algún comentario sobre su candidatura. No sabía si le contestarían. Esa parte tampoco dependía de ella. Lo que sí dependía de ella era volver a enviar currículos esa misma semana, con el portafolio mejorado y la experiencia de una entrevista más en el cuerpo."], ["q", "Haz tu parte entera y deja de cargar con la parte de los demás."], ["voz", ["Hay días en que lo haces todo bien y no sale. Es así, y no pasa nada por decirlo. Yo prefiero mirar mi parte y preguntarme si la hice entera. Si la respuesta es sí, puedo dormir tranquilo aunque el resultado no llegue. Lo que no quiero es usar la incertidumbre como excusa para no presentarme."]], ["cuaderno", ["Elige una situación que ahora mismo te tenga en vilo. Dibuja tres círculos en una hoja. En el primero escribe qué depende de ti. En el segundo, qué puedes influir. En el tercero, qué no controlas. Después elige una acción del primer círculo para esta semana y escribe una frase para soltar lo del tercero. Por ejemplo: «Esto no lo decido yo, y está bien»."]]]}, {"n": "04", "title": "Celebrar sin detenerte", "sub": "Reconocer el avance refuerza el aprendizaje.", "body": [["h", "Dieciocho páginas en un cajón"], ["p", "Emilio tiene sesenta y un años, se jubiló hace poco como profesor de instituto y lleva media vida diciendo que algún día escribiría una novela. Esta primavera, por fin, terminó el primer capítulo. Dieciocho páginas. Las imprimió, las leyó una vez, las guardó en un cajón y pensó: «Bueno, esto no es nada. Faltan otros veinte»."], ["p", "Su mujer le propuso salir a cenar para celebrarlo. Él se rió. «¿Celebrar qué? Si no he terminado nada»."], ["p", "Pero sí había terminado algo. Había terminado lo que llevaba treinta años sin empezar. Terminar el primer capítulo merece atención, aunque falte el resto del libro."], ["h", "Por qué te cuesta tanto reconocerlo"], ["p", "Mucha gente se educó con la idea de que celebrar es presumir, o de que relajarse antes de tiempo es peligroso. «No vendas la piel del oso antes de cazarlo». Esa prudencia tiene su lógica, pero llevada al extremo produce algo triste: personas que avanzan mucho y sienten que nunca han hecho nada."], ["p", "Si solo celebras los grandes resultados, vas a pasar la mayor parte de tu vida sin celebrar. Los grandes resultados llegan pocas veces y, a menudo, dependen en parte de cosas que no controlas. Las acciones y los aprendizajes, en cambio, ocurren todas las semanas. Ahí es donde conviene poner la atención."], ["p", "Celebrar no es un premio que te ganas al final. Es una forma de decirte: esto que he hecho importa y merece la pena repetirlo."], ["p", "Piensa en cómo aprende un niño a andar. Nadie espera a que cruce el pasillo entero para aplaudirle. Se le aplaude el primer paso torpe, y por eso se atreve a dar el segundo. De adultos nos quitamos ese aplauso pensando que ya no lo necesitamos. Pero seguimos funcionando parecido: lo que se reconoce tiende a repetirse, y lo que pasa sin que nadie lo mire, ni siquiera tú, se olvida pronto."], ["h", "Una fiesta corta y una pregunta"], ["p", "También existe el riesgo contrario: celebrar tanto un logro que se convierte en el sitio donde te quedas. Emilio podría pasarse un año contando a todo el mundo que ha escrito un capítulo y no escribir el segundo."], ["p", "La clave está en que la celebración sea proporcionada y breve. Una cena, un paseo, un mensaje a alguien que te importa, una línea en tu libreta. Algo que marque el momento y te devuelva al camino con más ganas, no con la sensación de que ya has llegado."], ["p", "Una buena pregunta para cerrar cada celebración: ¿qué he aprendido haciendo esto que me sirva para el siguiente paso? Así la fiesta no te detiene. Te empuja."], ["p", "Emilio, al final, aceptó la cena. Y al volver a casa abrió un documento nuevo y escribió el título del segundo capítulo. Solo el título. Para empezar, era suficiente."], ["q", "Lo que no reconoces, tu cabeza lo da por no hecho."], ["voz", ["Celebra las acciones, no solo los resultados. El resultado a veces llega y a veces no, pero la acción es tuya. Si hiciste la llamada que temías, si tuviste la conversación difícil, si cumpliste lo que te prometiste, eso ya merece que te pares un minuto y lo mires. Luego, a por lo siguiente."]], ["cuaderno", ["Haz una lista de diez avances verificables de los últimos meses. Verificables significa que alguien podría comprobarlos: un curso terminado, una conversación que tuviste, un hábito que mantuviste tres semanas, un presupuesto que enviaste. Al lado de cada uno escribe qué aprendiste. Después elige uno de la lista y celébralo esta semana de forma sencilla. Y apunta cuál será tu siguiente paso."]]]}, {"n": "05", "title": "Compartir sin predicar", "sub": "Tu experiencia no es una ley universal.", "body": [["h", "La sobremesa del madrugón"], ["p", "Julia tiene cuarenta y cuatro años y hace un año empezó a levantarse a las seis para tener una hora solo para ella. Lee, camina, escribe. Le ha cambiado el humor y la forma de afrontar el día. Está tan contenta que se lo cuenta a todo el mundo. En una comida familiar se lo recomienda a su cuñada, que trabaja de noche en un hospital, y a su sobrino, que tiene un bebé de cuatro meses."], ["p", "«Es que si lo hicierais, veríais», insiste. Su cuñada sonríe sin ganas. Su sobrino cambia de tema."], ["p", "Julia no tiene mala intención. Pero ha cometido un error muy común: convertir lo que le funcionó a ella en una receta para los demás. Una técnica que te ayudó puede no servir a otra persona con circunstancias distintas."], ["h", "Cuenta el proceso, no la promesa"], ["p", "Cuando algo te cambia la vida, es natural querer compartirlo. Y está bien. Lo que conviene revisar es cómo. Hay una diferencia grande entre «haz esto y te irá bien» y «esto es lo que hice, esto me costó y esto me ayudó»."], ["p", "La primera frase promete un resultado que no puedes garantizar. La segunda cuenta un proceso y deja que la otra persona decida si le sirve. La primera pone a quien escucha en el papel de alumno. La segunda le trata como a un adulto."], ["p", "Cuando compartas, incluye los límites: en qué situación estabas, qué recursos tenías, qué no funcionó. Julia podría decir: «A mí madrugar me ha ido bien porque mis hijos ya son mayores y puedo acostarme pronto. Sé que no todo el mundo puede»."], ["h", "La dificultad hace creíble tu historia"], ["p", "Hay otra trampa: contar solo la parte bonita. El antes y el después, sin el durante. Eso puede inspirar un rato, pero a quien escucha le deja la sensación de que a ti te salió fácil y a él no le sale por algún defecto suyo."], ["p", "Cuando incluyes una dificultad real, tu historia gana verdad. Las semanas en que no te levantabas. El día que lo dejaste. Lo que tuviste que cambiar. Eso no te resta autoridad. Te la da, porque la gente se reconoce mucho más en lo difícil que en lo perfecto."], ["p", "Y queda una última cosa: escuchar. Antes de contar tu experiencia, pregunta cómo está la otra persona. Puede que no necesite un consejo. Puede que necesite que alguien la entienda."], ["p", "Una prueba sencilla antes de recomendar algo: pregúntate si estarías dispuesto a escuchar un «a mí eso no me sirve» sin sentirte atacado. Si la respuesta es no, quizá no estás compartiendo. Quizá estás buscando que alguien confirme que tu camino es el bueno. Y eso es muy humano, pero no es lo mismo. Compartir de verdad deja la puerta abierta a que el otro elija algo distinto."], ["q", "Comparte el camino, no vendas el destino."], ["voz", ["Lo que te cuento aquí me ha servido a mí. No sé si te servirá igual. Tu vida no es la mía, ni tus circunstancias, ni tu momento. Cógelo como una idea para probar, no como una orden. Si algo no te encaja, déjalo. Y si te encaja, adáptalo a tu manera."]], ["cuaderno", ["Elige una experiencia que te haya ayudado y que te gustaría compartir. Escríbela en diez o quince líneas, como si se la contaras a un amigo. Incluye en qué situación estabas, qué hiciste, una dificultad real que encontraste y qué no puedes garantizar a otra persona. Léela en voz alta. Si suena a sermón, reescríbela hasta que suene a conversación. Después, si te apetece, compártela con alguien y escucha lo que te devuelve."]]]}, {"n": "06", "title": "Diseña tu próxima estación", "sub": "Un objetivo cumplido abre nuevas preguntas.", "body": [["h", "El lunes después del lanzamiento"], ["p", "Víctor tiene treinta y cinco años y acaba de lanzar su tienda online de cerámica. Ha pasado meses trabajando por las noches, fotografiando piezas y peleándose con la web. El lanzamiento salió razonablemente bien: llegaron los primeros pedidos y algunos clientes repitieron. El lunes siguiente se despertó y no sabía qué hacer."], ["p", "No era tristeza exactamente. Era un vacío raro. Llevaba tanto tiempo con un único objetivo que, al cumplirlo, se quedó sin brújula. Su primer impulso fue lanzarse a lo siguiente: vender fuera de España, sacar una línea nueva, apuntarse a un curso. Todo a la vez."], ["p", "Después de un lanzamiento quizá necesites descansar, consolidar o elegir otra prioridad. Pero eso no se decide a la carrera."], ["h", "Cuatro preguntas antes del siguiente reto"], ["p", "Cuando terminas una etapa, tienes una oportunidad que no aparece a menudo: mirar con perspectiva. Conviene aprovecharla antes de fijar el siguiente reto. Revisa cuatro cosas."], ["p", "Valores: ¿lo que estás haciendo sigue conectado con lo que te importa, o te has ido desviando sin darte cuenta? Energía: ¿cómo has llegado hasta aquí, con ganas o al límite? Resultados: ¿qué ha funcionado, qué no, qué sabes ahora que antes no sabías? Relaciones: ¿a quién has descuidado por el camino? ¿Quién te ha apoyado y merece que se lo digas?"], ["p", "Víctor, al hacer esta revisión, se dio cuenta de que llevaba tres meses durmiendo mal y sin ver a sus amigos. El siguiente reto no podía ser vender fuera. Tenía que ser consolidar lo que ya tenía con una rutina que pudiera sostener."], ["h", "Elegir también es renunciar"], ["p", "Una hoja de ruta que solo suma acaba siendo una lista imposible. Cada vez que dices sí a un objetivo, dices no a otras cosas, aunque no lo escribas. Mejor escribirlo."], ["p", "Una renuncia consciente es decidir de antemano qué no vas a hacer durante esta etapa. No porque no importe, sino porque ahora no toca. Víctor decidió no sacar nuevas líneas de producto en los próximos tres meses. Eso le liberó la cabeza para lo que sí importaba: atender bien a quien ya le compraba y volver a dormir."], ["p", "Noventa días es un buen horizonte. Lo bastante largo para ver avances. Lo bastante corto para revisar sin sentir que has perdido un año."], ["p", "Y no tengas miedo de que tu próxima estación parezca más pequeña que la anterior. Después de un esfuerzo grande, a veces lo más inteligente es una etapa tranquila: ordenar, aprender de lo que pasó, recuperar el sueño. Desde fuera puede parecer que te has parado. Desde dentro sabes que estás preparando el terreno para lo que venga después. Descansar con intención también es avanzar."], ["q", "Toda estación nueva empieza decidiendo qué dejas en el andén."], ["voz", ["Cuando consigues algo que llevabas tiempo persiguiendo, para un momento. Respira. No saltes al siguiente objetivo solo por miedo al vacío. Pregúntate cómo estás tú, cómo está tu gente y qué quieres de verdad ahora. A veces el siguiente paso es crecer. Otras veces es cuidar lo que ya has construido."]], ["cuaderno", ["Diseña una hoja de ruta de noventa días. Empieza por la revisión: escribe dos líneas sobre tus valores, dos sobre tu energía, dos sobre tus resultados y dos sobre tus relaciones. Después define un objetivo principal para los próximos tres meses y una acción mensual que lo apoye. Por último, escribe una renuncia consciente: algo que no harás en este periodo para proteger lo importante. Pon en el calendario la fecha de la revisión del día noventa."]]]}, {"n": "07", "title": "El manifiesto de tu vida", "sub": "Manifestar es convertir intención en presencia y acción.", "body": [["h", "La puerta del armario"], ["p", "Paula tiene cincuenta años, es abogada y madre de dos adolescentes. Hace tiempo pegó en la puerta del armario una lista de afirmaciones que encontró en internet. «Soy abundancia». «Atraigo el éxito sin esfuerzo». «El universo conspira a mi favor». Las leía cada mañana mientras elegía la ropa. Con los meses dejó de verlas. Estaban ahí, como el papel pintado."], ["p", "Un día las quitó y escribió otras. Más cortas. Más suyas. «Elijo cenar con mis hijos sin el móvil en la mesa». «Elijo decir que no a los encargos que me quitan el sueño y no me pagan lo justo». «Elijo caminar media hora tres veces por semana». Esas no las dejó de ver. Porque cada día podía comprobar si las cumplía."], ["p", "Tu vida no se resume en una afirmación. Se resume en lo que eliges practicar cuando nadie mira."], ["h", "Un manifiesto que se pueda revisar"], ["p", "La palabra manifiesto suena solemne. Aquí no lo es. Es un texto corto donde escribes cómo quieres vivir, con frases que puedas llevar a tu calendario. Sin promesas sobrenaturales, sin garantías de resultados, sin frases que dependan de que otros cambien."], ["p", "Un buen manifiesto cumple tres condiciones. Cada línea describe algo que se puede hacer. Las frases son tuyas, aunque alguna se inspire en otras. Y lo relees cada cierto tiempo para cambiar lo que ya no encaja. Un manifiesto que no se revisa termina siendo otra lista olvidada en la puerta de un armario."], ["p", "Tampoco tiene que ser largo. Diez líneas bastan. Si escribes cuarenta, no vas a recordar ninguna. Piensa en él como en el mapa de bolsillo de la persona que estás construyendo: lo bastante pequeño para llevarlo encima y lo bastante claro para consultarlo cuando dudes. Puedes guardarlo en el móvil, en la cartera o, como Paula, en la puerta del armario."], ["h", "Elijo, no prometo"], ["p", "Empezar cada línea por «Elijo» tiene una razón. «Prometo» suena a deuda: si fallas, has incumplido. «Elijo» te recuerda que cada día vuelves a decidir. Si un día no lo haces, mañana puedes elegir otra vez. No es menos exigente. Es más humano."], ["p", "Cuando escribas, recorre todo lo que has trabajado en este libro: lo que toleras, tus creencias, tus decisiones, tu dinero, tus relaciones, tu forma de afrontar lo que no controlas. Y pregúntate en cada área qué elección pequeña y repetida representaría a la persona que estás construyendo."], ["p", "No hace falta que suene bonito. Hace falta que sea verdad. «Elijo revisar mis cuentas cada domingo» vale más que «elijo la prosperidad infinita», porque la primera te dice qué hacer el domingo y la segunda no te dice nada."], ["p", "Al final, firma. No porque sea un contrato, sino porque firmar te obliga a leer lo que has escrito como algo serio. Y lo es."], ["q", "No necesitas una afirmación más. Necesitas una elección que se vea."], ["voz", ["Nos han enseñado a vivir al revés: cuando tenga, haré, y entonces seré. Es al contrario. Primero eres. Luego haces. Y entonces tienes. Tu manifiesto va de eso: decidir hoy quién eres y demostrarlo con lo que haces mañana. Ser. Hacer. Tener. En ese orden."]], ["cuaderno", ["Redacta diez líneas que empiecen por «Elijo...». Cada una tiene que describir algo que puedas hacer y comprobar. Incluye al menos una sobre tu salud, una sobre tu dinero, una sobre tus relaciones y una sobre tu trabajo o tu proyecto. Léelas en voz alta. Tacha las que suenen a deseo vago y reescríbelas. Después elige una línea, conviértela en tu primer compromiso con fecha y fírmalo. Anota en el calendario cuándo releerás el manifiesto, dentro de tres meses."]]]}], "cierre": {"title": "De la lectura a la vida", "body": [["p", "Si has llegado hasta aquí, no necesitas memorizar siete conceptos. Necesitas elegir uno y llevarlo a la práctica. Una semana bien observada vale más que cien promesas grandilocuentes. Antes de pasar página, revisa qué has aprendido en este módulo, qué te ha sorprendido y qué estás dispuesto a cambiar de verdad. No hace falta que lo cambies todo a la vez. Basta con que la próxima elección pequeña vaya en la dirección que has escrito. Esa es la forma más honesta de vivir como el Gran Manifestador: sin esperar a sentirte preparado, sin culparte por lo que no controlas y sin dejar de hacer tu parte."]], "plan": ["Día 1 · Elige una de tus tres conductas y practícala durante siete días.", "Día 2 · Haz un inventario de recursos y una mejora económica responsable.", "Día 3 · Escribe qué depende de ti, qué puedes influir y qué no controlas.", "Día 4 · Haz una lista de diez avances verificables de los últimos meses.", "Día 5 · Cuenta una experiencia incluyendo una dificultad real.", "Día 6 · Diseña una hoja de ruta de noventa días con una renuncia consciente.", "Día 7 · Redacta diez líneas que empiecen por «Elijo...» y firma tu primer compromiso."], "frase": "El siguiente paso no tiene que ser perfecto. Tiene que ser real."}, "img": "mod07.jpg"}], "back": [{"id": "epilogo", "kicker": "Epílogo", "title": "La decisión que empieza hoy", "body": [["p", "No puedes escribir el futuro como quien dicta una orden. Puedes, sin embargo, aprender a reconocer tus deseos, ordenar tus prioridades, cuidar tus vínculos y tomar decisiones con más conciencia. Puedes equivocarte, pedir ayuda y empezar de nuevo. Esa es una forma de poder menos espectacular y mucho más útil."], ["p", "Si algo merece el nombre de manifestación, es este encuentro entre lo que valoras y lo que haces. No te prometo que cada puerta se abra. Te propongo algo más serio: aprender a distinguir las puertas que vale la pena llamar, prepararte para atravesarlas y aceptar que también habrá caminos distintos a los previstos."], ["q", "No esperes a convertirte en otra persona para comenzar. Comienza, y deja que tus decisiones te enseñen quién puedes llegar a ser."], ["voz", ["Si has llegado hasta aquí, ya sabes lo que pienso: el día a día te baja, y por eso hay que volver una y otra vez a lo esencial. Primero eres. Luego haces. Y entonces tienes. No al revés. Elige una sola lección de este libro, la que más te haya escocido, y llévala a tu próxima semana. Nos vemos en el siguiente vídeo. Ser. Hacer. Tener."]]]}, {"id": "anexo", "kicker": "Anexo", "title": "Las historias de NEOX en este libro", "stories": [["Desarrollo personal", "01", "01", "La verdad incómoda que nadie te ha dicho sobre la manifestación"], const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// orden de lectura
const PAGES=[];
BOOK.front.forEach(f=>PAGES.push({id:f.id,kind:'front',data:f,label:f.title}));
BOOK.modules.forEach(m=>{
  PAGES.push({id:'m'+m.n,kind:'modintro',data:m,label:'Módulo '+(+m.n)+' · '+cap(m.title)});
  m.lessons.forEach(l=>PAGES.push({id:'m'+m.n+'-l'+l.n,kind:'lesson',data:l,mod:m,label:l.title}));
  if(m.cierre)PAGES.push({id:'m'+m.n+'-cierre',kind:'cierre',data:m.cierre,mod:m,label:'Cierre del módulo '+(+m.n)});
});
BOOK.back.forEach(f=>PAGES.push({id:f.id,kind:f.id==='anexo'?'anexo':'front',data:f,label:f.title}));
function cap(s){return s.charAt(0)+s.slice(1).toLowerCase()}
let size=+(store.get('egm-size')||18);
function applySize(){document.documentElement.style.setProperty('--size',size+'px')}
applySize();
function body(items){return items.map(it=>{
  const [t]=it;
  if(t==='p')return '<p>'+esc(it[1])+'</p>';
  if(t==='h')return '<h2>'+esc(it[1])+'</h2>';
  if(t==='q')return '<blockquote>«'+esc(it[1])+'»</blockquote>';
  if(t==='vivio')return '<aside class="vivio"><div class="nh"><img alt="NEOX" src="'+IMGS['neox.jpg']+'"><div><b>LO QUE VIVIÓ NEOX</b><span>Área · '+esc(it[1])+'</span></div></div>'+it[2].map(p=>'<p>'+esc(p)+'</p>').join('')+'</aside>';
  if(t==='voz')return '<aside class="voz"><b>LA VOZ DE NEOX</b>'+it[1].map(p=>'<p>'+esc(p)+'</p>').join('')+'</aside>';
  if(t==='cuaderno')return '<div class="cuad"><b>CUADERNO DE ACCIÓN</b>'+it[1].map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>';
  return '';}).join('')}
function bar(title,idx){
  const pct=idx==null?0:Math.round((idx+1)/PAGES.length*100);
  return '<div class="bar"><div class="wrap"><button class="btn" id="b-ind" aria-label="Volver al índice">Índice</button><div class="t">'+esc(title)+'</div>'+
  '<button class="btn" id="b-m" aria-label="Letra más pequeña">A−</button><button class="btn" id="b-p" aria-label="Letra más grande">A+</button></div><div class="prog"><i style="width:'+pct+'%"></i></div></div>';
}
function home(){
  const last=store.get('egm-last');const lp=PAGES.find(p=>p.id===last);
  let h='<header class="cover" style="background-image:url('+IMGS['mod01.jpg']+')"><div class="wrap"><small>Edición con las historias de NEOX</small><h1>EL GRAN MANIFESTADOR</h1><p>Siete módulos. Cuarenta y nueve lecciones. Una vida construida con intención y acción.</p>'+
    (lp?'<button class="btn solid" data-go="'+lp.id+'">Seguir leyendo · '+esc(lp.label)+'</button>':'<button class="btn solid" data-go="'+PAGES[0].id+'">Empezar a leer</button>')+'</div></header>';
  h+='<main class="wrap home"><div class="sect">Antes de empezar</div><div class="links">'+BOOK.front.map(f=>'<button class="link" data-go="'+f.id+'">'+esc(f.title)+'<span>'+esc(f.kicker)+'</span></button>').join('')+'</div>';
  h+='<div class="sect">Los siete módulos</div>';
  BOOK.modules.forEach(m=>{
    h+='<section class="mod"><button data-go="m'+m.n+'"><div class="img" style="background-image:url('+IMGS[m.img]+')"></div><div class="mt"><small>MÓDULO '+(+m.n)+'</small><b>'+esc(cap(m.title))+'</b></div></button><ol>'+
      m.lessons.map(l=>'<li><button data-go="m'+m.n+'-l'+l.n+'" class="'+(l.body.some(b=>b[0]==='vivio')?'neoxdot':'')+'"><em>'+l.n+'</em><span>'+esc(l.title)+'</span></button></li>').join('')+
      (m.cierre?'<li><button data-go="m'+m.n+'-cierre"><em>·</em><span>Cierre del módulo y plan de 7 días</span></button></li>':'')+'</ol></section>';
  });
  h+='<div class="sect">Para terminar</div><div class="links">'+BOOK.back.map(f=>'<button class="link" data-go="'+f.id+'">'+esc(f.title)+'<span>'+esc(f.kicker)+'</span></button>').join('')+'</div></main>';
  return h;
}
function page(p){
  const d=p.data;let h='';
  if(p.kind==='front'){
    h='<div class="kick">'+esc(d.kicker)+'</div><h1>'+esc(d.title)+'</h1>'+(d.id==='neox'?'<div class="hero" style="height:140px;width:140px;border-radius:50%;background-image:url('+IMGS['neox.jpg']+')"></div>':'')+body(d.body);
    if(d.areas)h+='<div class="areas">'+d.areas.map(a=>'<div class="area"><b>'+esc(a[0])+'</b>'+esc(a[1])+'</div>').join('')+'</div>'+(d.after||[]).map(x=>'<p>'+esc(x)+'</p>').join('');
  }else if(p.kind==='modintro'){
    h='<div class="hero" style="background-image:url('+IMGS[d.img]+')"></div><div class="kick">Módulo '+(+d.n)+' de 7</div><h1>'+esc(cap(d.title))+'</h1>'+d.intro.map(x=>'<p>'+esc(x)+'</p>').join('')+
      '<h2>Tu ruta de siete lecciones</h2><ol class="ruta">'+d.ruta.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ol>';
  }else if(p.kind==='lesson'){
    h='<div class="kick">Módulo '+(+p.mod.n)+' · Lección '+(+d.n)+' de 7</div><h1>'+esc(d.title)+'</h1><p class="sub">'+esc(d.sub)+'</p>'+body(d.body);
  }else if(p.kind==='cierre'){
    h='<div class="kick">Cierre del módulo '+(+p.mod.n)+'</div><h1>'+esc(d.title)+'</h1>'+body(d.body)+'<h2>Tu plan de siete días</h2><ul class="plan">'+d.plan.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+(d.frase?'<blockquote>«'+esc(d.frase)+'»</blockquote>':'');
  }else if(p.kind==='anexo'){
    const areas=['Desarrollo personal','Negocio','Hijos','Pareja'];
    h='<div class="kick">Anexo</div><h1>'+esc(d.title)+'</h1><p>Las lecciones en las que NEOX cuenta una historia vivida, ordenadas por las cuatro áreas de su vida. Toca una para ir directamente.</p><div class="anx">'+
      areas.map(a=>{const it=d.stories.filter(s=>s[0].toLowerCase().startsWith(a.toLowerCase().slice(0,6)));
        return '<h2>'+a+'</h2>'+(it.length?'<div class="links">'+it.map(s=>'<button class="link" data-go="m'+s[1]+'-l'+s[2]+'">'+esc(s[3])+'<span>M'+(+s[1])+' · L'+(+s[2])+'</span></button>').join('')+'</div>':'<p><em>Las historias de NEOX en esta área llegarán en la próxima edición.</em></p>')}).join('')+'</div>';
  }
  return h;
}
function render(){
  const id=location.hash.slice(1);const idx=PAGES.findIndex(p=>p.id===id);
  const app=$('#app');
  if(idx<0){app.innerHTML=home();bind();window.scrollTo(0,0);return}
  const p=PAGES[idx],prev=PAGES[idx-1],next=PAGES[idx+1];
  store.set('egm-last',p.id);
  app.innerHTML=bar(p.mod?'Módulo '+(+p.mod.n)+' · '+cap(p.mod.title):'El Gran Manifestador',idx)+
    '<main class="wrap read">'+page(p)+'</main><nav class="wrap nav">'+
    '<button '+(prev?'data-go="'+prev.id+'"':'disabled')+'><small>ANTERIOR</small>'+(prev?esc(prev.label):'')+'</button>'+
    '<button class="next" '+(next?'data-go="'+next.id+'"':'data-go=""')+'><small>'+(next?'SIGUIENTE':'FIN')+'</small>'+(next?esc(next.label):'Volver al índice')+'</button></nav>';
  bind();window.scrollTo(0,0);
}
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{const g=b.getAttribute('data-go');location.hash=g?g:'';if(!g)render()}));
  const ind=$('#b-ind');if(ind)ind.onclick=()=>{location.hash='';render()};
  const m=$('#b-m'),pl=$('#b-p');
  if(m)m.onclick=()=>{size=Math.max(15,size-1);store.set('egm-size',size);applySize()};
  if(pl)pl.onclick=()=>{size=Math.min(26,size+1);store.set('egm-size',size);applySize()};
}
window.addEventListener('hashchange',render);
render();
</script>
