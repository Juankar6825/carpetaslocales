<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(../trailer/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}

html,body{margin:0;background:#000}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d'),GOLD='#f5b942',GOLD2='#ffdf8a';

function T(s,x,y,o){let size=o.size;g.save();g.font=`${o.w||''} ${size}px ${o.f||'Anton'}`;if(o.sp)g.letterSpacing=o.sp+'px';const mw=o.maxW||9999,m=g.measureText(s).width;if(m>mw){size*=mw/m;g.font=`${o.w||''} ${size}px ${o.f||'Anton'}`}

 let gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'rgba(0,0,0,.92)');gr.addColorStop(o.v?0.0:.5,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,.15)');if(!o.v){g.fillStyle=gr;g.fillRect(0,0,W,H)}
 else{gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(0,0,0,.25)');gr.addColorStop(.45,'rgba(0,0,0,.75)');gr.addColorStop(1,'rgba(0,0,0,.95)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
